name: Update Dota 2 Stats

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Dota Data and Generate HTML
        run: |
          cat << 'EOF' > dota_script.py
          import requests

          try:
              # Твой ID игрока жестко прописан здесь
              steam_id = "924159299"
              
              # Запрос списка героев
              hero_map = {}
              try:
                  heroes_res = requests.get('https://opendota.com', timeout=15).json()
                  hero_map = {h['id']: h['localized_name'] for h in heroes_res if 'id' in h}
              except Exception as he:
                  print(f"Предупреждение по героям: {he}")

              # Прямой и чистый URL к OpenDota без склеек
              url = f"https://api.opendota.com/api/players/{steam_id}/recentMatches"
              print(f"Делаем запрос к: {url}")
              
              response = requests.get(url, timeout=15)
              if response.status_code != 200:
                  print(f"Ошибка API: Код {response.status_code}")
                  exit(1)
                  
              matches = response.json()
              
              html_content = '''<!DOCTYPE html>
              <html lang="ru">
              <head>
                  <meta charset="UTF-8">
                  <meta name="viewport" content="width=device-width, initial-scale=1.0">
                  <title>Моя статистика Dota 2</title>
                  <style>
                      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121214; color: #e1e1e6; padding: 40px; max-width: 800px; margin: 0 auto; }
                      h1 { color: #fff; border-bottom: 2px solid #29292e; padding-bottom: 10px; }
                      table { width: 100%; border-collapse: collapse; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); background: #19191d; border-radius: 8px; overflow: hidden; }
                      th, td { padding: 14px; text-align: left; border-bottom: 1px solid #29292e; }
                      th { background: #202024; color: #00b4d8; font-weight: 600; }
                      tr:hover { background: #222226; }
                      .win { color: #4ade80; font-weight: bold; }
                      .lose { color: #f87171; font-weight: bold; }
                  </style>
              </head>
              <body>
                  <h1>🎮 Мои последние 20 игр в Dota 2</h1>
                  <table>
                      <tr>
                          <th>Герой</th>
                          <th>Результат</th>
                          <th>K / D / A</th>
                          <th>Длительность</th>
                      </tr>
              '''
              
              for m in matches[:20]:
                  hero_id = m.get('hero_id', 0)
                  hero = hero_map.get(hero_id, f"Hero ID: {hero_id}")
                  
                  is_radiant = m.get('player_slot', 0) < 128
                  radiant_win = m.get('radiant_win', False)
                  
                  win = (radiant_win and is_radiant) or (not radiant_win and not is_radiant)
                  res_text = '<span class="win">🟢 Победа</span>' if win else '<span class="lose">🔴 Поражение</span>'
                  
                  duration_sec = m.get('duration', 0)
                  duration = f"{duration_sec // 60}м {duration_sec % 60}с"
                  kda = f"{m.get('kills', 0)} / {m.get('deaths', 0)} / {m.get('assists', 0)}"
                  
                  html_content += f'<tr><td>{hero}</td><td>{res_text}</td><td>{kda}</td><td>{duration}</td></tr>\n'
              
              html_content += '</table></body></html>'
              
              with open('index.html', 'w', encoding='utf-8') as f:
                  f.write(html_content)
              print("HTML файл успешно сохранен!")
              
          except Exception as e:
              print(f"Критический сбой: {e}")
              exit(1)
          EOF
          python dota_script.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m "Update match history site" || exit 0
          git push
