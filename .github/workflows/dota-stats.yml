name: Update Dota 2 Tracker

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Generate Dota Page
        run: |
          python -c "
          import requests
          try:
              steam_id = '924159299'
              p_res = requests.get(f'https://opendota.com{steam_id}').json()
              prof = p_res.get('profile', {})
              name = prof.get('personaname', 'faukree')
              avatar = prof.get('avatarfull', '')
              rank = p_res.get('rank_tier', 0)
              mmr = p_res.get('mmr_estimate', {}).get('estimate', '—')
              
              medals = {1:'Herald', 2:'Guardian', 3:'Crusader', 4:'Archon', 5:'Legend', 6:'Ancient', 7:'Divine', 8:'Immortal'}
              title = f'{medals.get(rank//10, \"Unranked\")} [{rank%10}]' if rank else 'No Rank'
              
              h_res = requests.get('https://opendota.com').json()
              h_map = {h['id']: h['name'].replace('npc_dota_hero_', '') for h in h_res}
              
              matches = requests.get(f'https://opendota.com{steam_id}/matches?limit=20').json()
              
              html = f'<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>Dota Tracker</title><style>body{{background:#0c0d12;color:#b3b5c6;font-family:sans-serif;padding:30px;max-width:1000px;margin:0 auto;}}.card{{display:flex;align-items:center;background:#14161f;padding:20px;border-radius:12px;margin-bottom:20px;}}img.av{{width:64px;border-radius:50%;margin-right:20px;}}table{{width:100%;border-collapse:collapse;background:#14161f;border-radius:8px;overflow:hidden;}}th,td{{padding:12px;text-align:left;border-bottom:1px solid #1f222f;}}th{{background:#1b1e2a;color:#fff;}}.win{{color:#4ade80;}}.lose{{color:#f87171;}}img.h{{width:40px;vertical-align:middle;margin-right:10px;}}</style></head><body>'
              html += f'<div class=\"card\"><img class=\"av\" src=\"{avatar}\"><div><h2>{name}</h2><p>Rank: <b>{title}</b> | Est. MMR: <b>{mmr}</b></p></div></div>'
              html += '<table><tr><th>Hero</th><th>Result</th><th>K/D/A</th><th>GPM/XPM</th></tr>'
              
              for m in matches:
                  is_rad = m.get('player_slot', 0) < 128
                  win = (m.get('radiant_win') and is_rad) or (not m.get('radiant_win') and not is_rad)
                  res = '<span class=\"win\">Win</span>' if win else '<span class=\"lose\">Loss</span>'
                  h_img = f'https://steamstatic.com{h_map.get(m.get(\"hero_id\",0), \"unknown\")}.png'
                  html += f'<tr><td><img class=\"h\" src=\"{h_img}\">{m.get(\"hero_id\")}</td><td>{res}</td><td>{m.get(\"kills\")}/{m.get(\"deaths\")}/{m.get(\"assists\")}</td><td>{m.get(\"gold_per_min\")}/{m.get(\"xp_per_min\")}</td></tr>'
              
              html += '</table></body></html>'
              with open('index.html', 'w', encoding='utf-8') as f: f.write(html)
          except Exception as e:
              print(e)
          "

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
