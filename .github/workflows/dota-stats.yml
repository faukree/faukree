name: Update Dota 2 Profile Dashboard

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Fetch Dota Data and Update Profile
        run: |
          python -c "
          import requests
          try:
              steam_id = '924159299'
              
              # Запрос профиля игрока
              p_res = requests.get(f'https://opendota.com{steam_id}', timeout=15).json()
              prof = p_res.get('profile', {})
              name = prof.get('personaname', 'faukree')
              rank = p_res.get('rank_tier', 0)
              mmr = p_res.get('mmr_estimate', {}).get('estimate', '—')
              
              medals = {1:'Herald', 2:'Guardian', 3:'Crusader', 4:'Archon', 5:'Legend', 6:'Ancient', 7:'Divine', 8:'Immortal'}
              title = f'{medals.get(rank//10, \"Unranked\")} [{rank%10}]' if rank else 'No Rank'
              if rank and rank // 10 == 8: title = 'Immortal'
              
              # Запрос базы героев
              h_res = requests.get('https://opendota.com', timeout=15).json()
              h_name_map = {h['id']: h['localized_name'] for h in h_res}
              h_img_map = {h['id']: h['name'].replace('npc_dota_hero_', '') for h in h_res}
              
              # Запрос последних 20 матчей
              matches = requests.get(f'https://opendota.com{steam_id}/recentMatches', timeout=15).json()
              
              # Создаем разметку для главной страницы профиля
              md = f'# Привет, я {name} 👋\\n\\n'
              md += f'### 📊 Мой ранг: `{title}` | Примерный MMR: `{mmr}`\\n\\n'
              md += '## 🎮 Последние 20 игр в Dota 2\\n\\n'
              md += '| Герой | Результат | K / D / A | Длительность |\\n'
              md += '| :--- | :--- | :--- | :--- |\\n'
              
              for m in matches[:20]:
                  hero_id = m.get('hero_id', 0)
                  loc_name = h_name_map.get(hero_id, f'Hero ID: {hero_id}')
                  short_name = h_img_map.get(hero_id, 'unknown')
                  
                  # Ссылка на официальную иконку героя (будет отображаться прямо в профиле)
                  h_img_url = f'https://steamstatic.com{short_name}.png'
                  hero_html = f'<img src=\"{h_img_url}\" width=\"45\" height=\"25\" valign=\"middle\"> **{loc_name}**'
                  
                  is_rad = m.get('player_slot', 0) < 128
                  win = (m.get('radiant_win') and is_rad) or (not m.get('radiant_win') and not is_rad)
                  res = '🟢 **Победа**' if win else '🔴 *Поражение*'
                  
                  dur = m.get('duration', 0)
                  duration_text = f\"{dur // 60}м {dur % 60}с\"
                  kda = f\"{m.get('kills', 0)} / {m.get('deaths', 0)} / {m.get('assists', 0)}\"
                  
                  md += f'| {hero_html} | {res} | {kda} | {duration_text} |\\n'
              
              with open('README.md', 'w', encoding='utf-8') as f: 
                  f.write(md)
              print('README.md успешно обновлен!')
          except Exception as e:
              print(f'Ошибка: {e}')
              exit(1)
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@://github.com'
          git add README.md
          git commit -m "Update profile dota dashboard" || exit 0
          git push
