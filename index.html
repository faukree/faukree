<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAUKREE TRACKER</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0c0d12; color: #b3b5c6; padding: 40px 20px; max-width: 1100px; margin: 0 auto; }
        .header { display: flex; align-items: center; background: #14161f; border: 1px solid #232635; padding: 25px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .header img { width: 70px; height: 70px; border-radius: 50%; border: 2px solid #00b4d8; margin-right: 20px; }
        .header h1 { margin: 0; color: #fff; font-size: 26px; }
        .header p { margin: 8px 0 0 0; font-size: 14px; color: #767993; }
        .mmr-val { color: #ffb703; font-weight: bold; }
        .rank-val { color: #00b4d8; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; background: #14161f; border: 1px solid #232635; border-radius: 12px; overflow: hidden; }
        th, td { padding: 14px 20px; font-size: 14px; border-bottom: 1px solid #1f222f; text-align: left; }
        th { background: #1b1e2a; color: #fff; font-weight: 600; text-transform: uppercase; font-size: 11px; }
        tr:hover { background: #1a1d29; }
        .hero-cell { display: flex; align-items: center; gap: 15px; color: #fff; font-weight: 500; }
        .hero-cell img { width: 48px; height: 27px; border-radius: 4px; object-fit: cover; }
        .win { color: #4ade80; font-weight: bold; background: rgba(74, 222, 128, 0.1); padding: 4px 10px; border-radius: 6px; display: inline-block; }
        .lose { color: #f87171; font-weight: bold; background: rgba(248, 113, 113, 0.1); padding: 4px 10px; border-radius: 6px; display: inline-block; }
        .main-stat { color: #fff; font-weight: bold; }
        .sec-stat { color: #62657a; font-size: 12px; }
    </style>
</head>
<body>
    <!-- DOTA_DASHBOARD -->
</body>
</html>
