
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAUKREE — Dota 2 Tracker</title>
<style>
:root {
  color-scheme: dark;
  --bg: #090e16;
  --panel: #111a27;
  --panel2: #172334;
  --line: #27374b;
  --text: #edf3fc;
  --muted: #91a3ba;
  --green: #36d391;
  --red: #ff6574;
  --gold: #e8c477;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background:
    radial-gradient(ellipse at 50% -20%, #203653 0, transparent 65%),
    var(--bg);
  color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
  min-height: 100vh;
}
main { width: min(1050px, 100% - 32px); margin: 34px auto; }
header {
  display: flex; justify-content: space-between; align-items: center;
  gap: 16px; flex-wrap: wrap; margin-bottom: 22px;
}
.logo { font-size: 22px; font-weight: 900; letter-spacing: 2px; }
.logo span { color: var(--muted); font-size: 12px; letter-spacing: 1px; }
button {
  background: #223954; color: white; border: 1px solid #3b5879;
  border-radius: 10px; padding: 10px 15px; font-weight: 700;
  cursor: pointer; font-size: 14px;
}
button:hover { background: #2c496a; }
button:disabled { opacity: .6; cursor: wait; }
.panel {
  background: linear-gradient(145deg, #141f2e, #101722);
  border: 1px solid var(--line); border-radius: 16px;
  padding: 20px; margin-bottom: 18px;
  box-shadow: 0 12px 35px #0002;
}
.profile { display: flex; align-items: center; gap: 18px; }
.avatar {
  width: 86px; height: 86px; object-fit: cover;
  border-radius: 14px; background: var(--panel2);
  border: 1px solid var(--line);
}
.nickname { font-size: 27px; font-weight: 850; overflow-wrap: anywhere; }
.muted { color: var(--muted); }
.rank { display: flex; align-items: center; gap: 12px; margin-top: 7px; }
.rank img { width: 50px; height: 50px; object-fit: contain; }
.rank-name { color: var(--gold); font-weight: 750; }
.section-title {
  font-size: 18px; font-weight: 800; margin: 0;
}
.section-head {
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; flex-wrap: wrap; margin-bottom: 17px;
}
.status {
  display: flex; align-items: center; gap: 7px;
  font-size: 12px; color: var(--muted);
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
.error {
  background: #351c26; border: 1px solid #743441;
  color: #ffc0c7; padding: 12px; border-radius: 10px;
  margin-top: 15px; overflow-wrap: anywhere;
}
.empty { text-align: center; padding: 25px 10px; color: var(--muted); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 760px; }
th {
  color: var(--muted); font-size: 11px; text-transform: uppercase;
  letter-spacing: .6px; font-weight: 700;
  background: #172334;
}
th, td {
  text-align: left; padding: 12px 10px;
  border-bottom: 1px solid var(--line); white-space: nowrap;
}
tbody tr:hover { background: #ffffff06; }
.hero { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.hero img {
  width: 58px; height: 33px; object-fit: cover;
  border-radius: 5px; background: var(--panel2);
}
.win { color: var(--green); font-weight: 800; }
.loss { color: var(--red); font-weight: 800; }
.match-link { color: #a5caff; text-decoration: none; }
.match-link:hover { text-decoration: underline; }
footer { text-align: center; color: var(--muted); font-size: 12px; padding: 8px 0 25px; }
@media (max-width: 600px) {
  main { width: calc(100% - 20px); margin: 18px auto; }
  .panel { padding: 14px; border-radius: 13px; }
  .avatar { width: 66px; height: 66px; }
  .nickname { font-size: 21px; }
  .logo { font-size: 19px; }
}
</style>
</head>
<body>
<main>
  <header>
    <div class="logo">
      FAUKREE <span>/ DOTA 2 TRACKER</span>
    </div>
    <button id="refresh">↻ Обновить</button>
  </header>

  <section class="panel">
    <div class="profile">
      <img id="avatar" class="avatar"
        src="https://placehold.co/100x100/172334/ffffff?text=DOTA"
        alt="Аватар игрока">
      <div>
        <div id="nickname" class="nickname">Загрузка профиля...</div>
        <div class="muted">Steam ID: 924159299</div>
        <div class="rank">
          <img id="rankIcon" alt="Медаль" hidden>
          <div>
            <div id="rankName" class="rank-name">Загружаем ранг...</div>
            <div id="rankStars" class="muted"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="profileError"></div>
  </section>

  <section class="panel">
    <div class="section-head">
      <h2 class="section-title">Последние матчи</h2>
      <div class="status">
        <span class="dot"></span>
        <span id="updateStatus">Ожидание данных</span>
      </div>
    </div>

    <div id="matchesState" class="empty">Загружаем матчи...</div>

    <div class="table-wrap">
      <table id="matchTable" hidden>
        <thead>
          <tr>
            <th>Герой</th>
            <th>Результат</th>
            <th>K</th>
            <th>D</th>
            <th>A</th>
            <th>GPM</th>
            <th>XPM</th>
            <th>Дата</th>
          </tr>
        </thead>
        <tbody id="matchRows"></tbody>
      </table>
    </div>
  </section>

  <footer>
    FAUKREE Dota 2 Tracker · Данные OpenDota · Автообновление раз в 10 минут
  </footer>
</main>

<script>
(() => {
  'use strict';

  const ACCOUNT = '924159299';
  const API = 'https://dota2-proxy.faukree11.workers.dev';

  const $ = id => document.getElementById(id);

  let heroes = {};
  let busy = false;

  async function get(path) {
    const url = API + path;
    let response;

    try {
      response = await fetch(url, { cache: 'no-store' });
    } catch (error) {
      throw new Error(
        'Не удалось подключиться к Worker. Проверь интернет и адрес Worker.'
      );
    }

    if (!response.ok) {
      const details = await response.text().catch(() => '');
      throw new Error(
        'HTTP ' + response.status +
        (details ? ': ' + details.slice(0, 160) : '')
      );
    }

    try {
      return await response.json();
    } catch {
      throw new Error('Сервер вернул ответ не в формате JSON.');
    }
  }

  function showError(id, message) {
    const el = $(id);
    el.replaceChildren();

    if (!message) return;

    const box = document.createElement('div');
    box.className = 'error';
    box.textContent = message;
    el.appendChild(box);
  }

  function rankInfo(tier) {
    if (!tier) {
      return { name: 'Медаль не указана', star: '', icon: '' };
    }

    const medal = Math.floor(tier / 10);
    const star = tier % 10;

    const names = {
      1: 'Herald',
      2: 'Guardian',
      3: 'Crusader',
      4: 'Archon',
      5: 'Legend',
      6: 'Ancient',
      7: 'Divine',
      8: 'Immortal'
    };

    return {
      name: names[medal] || 'Неизвестный ранг',
      star: medal === 8 ? '' : 'Звезда ' + (star || 1),
      icon: medal >= 1 && medal <= 8
        ? 'https://www.opendota.com/assets/images/dota2/rank_icons/rank_icon_' + medal + '.png'
        : ''
    };
  }

  async function loadProfile() {
    const p = await get('/players/' + ACCOUNT);
    const d = p.profile || {};

    $('nickname').textContent = d.personaname || 'Игрок Dota 2';

    if (d.avatarfull) {
      $('avatar').src = d.avatarfull;
    }

    const rank = rankInfo(p.rank_tier);
    $('rankName').textContent = rank.name;
    $('rankStars').textContent = rank.star;

    const icon = $('rankIcon');

    if (rank.icon) {
      icon.src = rank.icon;
      icon.hidden = false;
      icon.onerror = () => { icon.hidden = true; };
    } else {
      icon.hidden = true;
    }

    showError('profileError', '');
  }

  async function loadHeroes() {
    const data = await get('/heroes');

    if (!Array.isArray(data)) {
      throw new Error('Справочник героев вернул неожиданный ответ.');
    }

    heroes = Object.fromEntries(data.map(h => [h.id, h]));
  }

  async function loadMatches() {
    let data;

    try {
      data = await get('/players/' + ACCOUNT + '/recentMatches');
    } catch (firstError) {
      data = await get('/players/' + ACCOUNT + '/matches?limit=20');
    }

    if (!Array.isArray(data)) {
      throw new Error('Сервер вернул неверный список матчей.');
    }

    return data.slice(0, 20);
  }

  function heroInfo(id) {
    const h = heroes[id];

    if (!h) {
      return {
        name: 'Герой #' + (id ?? '?'),
        img: ''
      };
    }

    const slug = h.name.replace('npc_dota_hero_', '');

    return {
      name: h.localized_name || slug,
      img: 'https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/' + slug + '.png'
    };
  }

  function isWin(m) {
    return (m.player_slot < 128) === Boolean(m.radiant_win);
  }

  function formatDate(timestamp) {
    if (!timestamp) return '—';

    return new Date(timestamp * 1000).toLocaleString('ru-RU', {
      day: '2-digit',
      month: '2-digit',
      year: '2-digit',
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  function cell(row, text, className) {
    const td = document.createElement('td');
    td.textContent = text;
    if (className) td.className = className;
    row.appendChild(td);
    return td;
  }

  function renderMatches(matches) {
    const rows = $('matchRows');
    rows.replaceChildren();

    if (!matches.length) {
      $('matchTable').hidden = true;
      $('matchesState').hidden = false;
      $('matchesState').textContent =
        'Матчи не найдены. Возможно, история матчей скрыта в настройках Dota 2.';
      return;
    }

    matches.forEach(m => {
      const row = document.createElement('tr');
      const hero = heroInfo(m.hero_id);

      const heroCell = document.createElement('td');
      const heroWrap = document.createElement('div');
      heroWrap.className = 'hero';

      if (hero.img) {
        const img = document.createElement('img');
        img.src = hero.img;
        img.alt = hero.name;
        img.loading = 'lazy';
        img.onerror = () => img.remove();
        heroWrap.appendChild(img);
      }

      const heroName = document.createElement('span');
      heroName.textContent = hero.name;
      heroWrap.appendChild(heroName);
      heroCell.appendChild(heroWrap);
      row.appendChild(heroCell);

      const win = isWin(m);
      cell(row, win ? 'ПОБЕДА' : 'ПОРАЖЕНИЕ', win ? 'win' : 'loss');
      cell(row, String(m.kills ?? 0));
      cell(row, String(m.deaths ?? 0));
      cell(row, String(m.assists ?? 0));
      cell(row, String(m.gold_per_min ?? '—'));
      cell(row, String(m.xp_per_min ?? '—'));

      const dateCell = document.createElement('td');
      const link = document.createElement('a');
      link.className = 'match-link';
      link.href = 'https://www.opendota.com/matches/' + encodeURIComponent(m.match_id);
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = formatDate(m.start_time);
      dateCell.appendChild(link);
      row.appendChild(dateCell);

      rows.appendChild(row);
    });

    $('matchesState').hidden = true;
    $('matchTable').hidden = false;
  }

  async function refresh() {
    if (busy) return;

    busy = true;
    const button = $('refresh');
    button.disabled = true;
    button.textContent = 'Загрузка...';
    $('updateStatus').textContent = 'Обновляем данные...';

    try {
      // Профиль и справочник загружаются независимо.
      const results = await Promise.allSettled([
        loadProfile(),
        loadHeroes()
      ]);

      const profileResult = results[0];
      const heroesResult = results[1];

      if (profileResult.status === 'rejected') {
        showError('profileError',
          'Не удалось загрузить профиль: ' +
          profileResult.reason.message);
      }

      if (heroesResult.status === 'rejected') {
        console.warn('Не удалось загрузить героев:', heroesResult.reason);
      }

      try {
        const matches = await loadMatches();
        renderMatches(matches);
      } catch (error) {
        $('matchesState').hidden = false;
        $('matchesState').textContent =
          'Не удалось загрузить матчи: ' + error.message;
        $('matchTable').hidden = true;
      }

      $('updateStatus').textContent =
        'Обновлено: ' + new Date().toLocaleTimeString('ru-RU', {
          hour: '2-digit',
          minute: '2-digit'
        });
    } finally {
      busy = false;
      button.disabled = false;
      button.textContent = '↻ Обновить';
    }
  }

  $('refresh').addEventListener('click', refresh);

  refresh();
  setInterval(refresh, 10 * 60 * 1000);
})();
</script>
</body>
</html>
