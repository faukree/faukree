<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAUKREE TRACKER</title>
    <style>
        body { font-family: sans-serif; background: #0c0d12; color: #b3b5c6; padding: 30px 20px; max-width: 1000px; margin: 0 auto; }
        .header { display: flex; align-items: center; background: #14161f; border: 1px solid #232635; padding: 20px; border-radius: 12px; margin-bottom: 25px; }
        .header img { width: 65px; height: 65px; border-radius: 50%; border: 2px solid #00b4d8; margin-right: 15px; }
        .header h1 { margin: 0; color: #fff; font-size: 24px; }
        .header p { margin: 5px 0 0 0; font-size: 14px; color: #767993; }
        .mmr-val { color: #ffb703; font-weight: bold; }
        .rank-val { color: #00b4d8; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; background: #14161f; border: 1px solid #232635; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; font-size: 14px; border-bottom: 1px solid #1f222f; text-align: left; }
        th { background: #1b1e2a; color: #fff; text-transform: uppercase; font-size: 11px; }
        tr:hover { background: #1a1d29; }
        .hero-cell { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 500; }
        .hero-cell img { width: 45px; height: 25px; border-radius: 3px; object-fit: cover; }
        .win { color: #4ade80; font-weight: bold; }
        .lose { color: #f87171; font-weight: bold; }
        .loading { padding: 40px; text-align: center; color: #767993; }
    </style>
</head>
<body>

    <div class="header">
        <img id="avatar" src="https://placeholder.com" alt="Avatar">
        <div>
            <h1 id="username">faukree</h1>
            <p>ID: 924159299 | Звание: <span id="rank" class="rank-val">...</span> | MMR: <span id="mmr" class="mmr-val">...</span></p>
        </div>
    </div>

    <div id="loader" class="loading">Синхронизация данных с OpenDota...</div>
    <table id="match-table" style="display: none;">
        <thead>
            <tr>
                <th>Герой</th>
                <th>Результат</th>
                <th>K / D / A</th>
                <th>GPM / XPM</th>
                <th>Крипы</th>
                <th>Время</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>

    <script>
        const STEAM_ID = "924159299";
        
        async function fetchDota() {
            try {
                // Загружаем профиль через публичный CORS-прокси сообщества AllOrigins
                const pRes = await fetch(`https://allorigins.win{encodeURIComponent('https://opendota.com' + STEAM_ID)}`);
                const pData = JSON.parse((await pRes.json()).contents);
                
                if (pData.profile) {
                    document.getElementById('avatar').src = pData.profile.avatarfull;
                    document.getElementById('username').innerText = pData.profile.personaname;
                }
                document.getElementById('mmr').innerText = pData.mmr_estimate?.estimate || '—';
                
                const rank = pData.rank_tier;
                const medals = {1:'Herald', 2:'Guardian', 3:'Crusader', 4:'Archon', 5:'Legend', 6:'Ancient', 7:'Divine', 8:'Immortal'};
                document.getElementById('rank').innerText = rank ? `${medals[Math.floor(rank/10)]} [${rank%10}]` : 'No Rank';

                // Загружаем базу героев для имен и картинок
                const hRes = await fetch(`https://allorigins.win{encodeURIComponent('https://opendota.com')}`);
                const hList = JSON.parse((await hRes.json()).contents);
                const heroMap = {};
                hList.forEach(h => {
                    heroMap[h.id] = { name: h.localized_name, tag: h.name.replace('npc_dota_hero_', '') };
                });

                // Загружаем последние 20 матчей с расширенной статистикой
                const mRes = await fetch(`https://allorigins.win{encodeURIComponent('https://opendota.com' + STEAM_ID + '/matches?limit=20')}`);
                const matches = JSON.parse((await mRes.json()).contents);
                
                const tbody = document.getElementById('table-body');
                matches.forEach(m => {
                    const hero = heroMap[m.hero_id] || { name: 'Unknown', tag: 'unknown' };
                    const heroImg = `https://steamstatic.com{hero.tag}.png`;
                    
                    const isRadiant = m.player_slot < 128;
                    const win = (m.radiant_win && isRadiant) || (!m.radiant_win && !isRadiant);
                    const resHtml = win ? '<span class="win">Победа</span>' : '<span class="lose">Поражение</span>';
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>
                            <div class="hero-cell">
                                <img src="${heroImg}" onerror="this.src='https://placeholder.com';" alt="hero">
                                <span>${hero.name}</span>
                            </div>
                        </td>
                        <td>${resHtml}</td>
                        <td><b>${m.kills}</b> / ${m.deaths} / ${m.assists}</td>
                        <td>${m.gold_per_min} / <span style="color:#62657a">${m.xp_per_min}</span></td>
                        <td>${m.last_hits} / <span style="color:#62657a">${m.denies}</span></td>
                        <td>${Math.floor(m.duration / 60)}м ${m.duration % 60}с</td>
                    `;
                    tbody.appendChild(tr);
                });
                
                document.getElementById('loader').style.display = 'none';
                document.getElementById('match-table').style.display = 'table';
            } catch (e) {
                document.getElementById('loader').innerText = 'Ошибка загрузки данных. Проверьте сеть и перезагрузите страницу.';
                console.error(e);
            }
        }
        fetchDota();
    </script>
</body>
</html>
